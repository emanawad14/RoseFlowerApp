<div class="w-h-screen bg-[#F6F7F8] flex justify-center items-center py-5">
  <div
    class="w-full  bg-white rounded-2xl shadow-lg border border-gray-200
     p-6 flex flex-col justify-between"
  >
    
    <div class="mb-8 ">
      <h1 class="text-4xl font-semibold text-gray-800 mb-8">
        Add a New Category
      </h1>
      
      
    </div>

    
   <form class="flex flex-col items-center gap-5 flex-grow" (submit)="onSubmit()" enctype="multipart/form-data">
  <div class="flex flex-col w-[85%] sm:w-full">
    <label for="name" class="text-gray-700 font-medium mb-1">Name *</label>
    <input
      id="name"
      type="text"
      placeholder="Enter category name"
      [(ngModel)]="categoryName"
      name="name"
      class="border border-gray-300 rounded-lg px-4 py-2 w-[80%] focus:outline-none focus:ring-2 focus:ring-[#A6252A] focus:border-[#A6252A] transition"
    />
  </div>

  <div class="flex flex-col w-[85%] sm:w-full">
    <label for="image" class="text-gray-700 font-medium mb-1">Category Image *</label>
    <input
      id="image"
      type="file"
      (change)="onFileSelected($event)"
      name="image"
      accept="image/*"
      class="border border-gray-300 rounded-lg px-4 py-2 w-[80%] focus:outline-none focus:ring-2 focus:ring-[#A6252A] focus:border-[#A6252A] transition file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[#A6252A] file:text-white hover:file:bg-[#8e1f24]"
    />
  </div>

  <div class="w-[85%] sm:w-full mt-4">
    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="loading"
      class="flex items-center justify-center gap-2 bg-[#A6252A] hover:bg-[#8e1f24] text-white font-semibold px-6 py-2.5 rounded-lg shadow-md w-[80%] transition"
    >
      <i class="pi pi-plus"></i>
      {{ loading ? 'Adding...' : 'Add Category' }}
    </button>
  </div>
</form>

  </div>
</div>
