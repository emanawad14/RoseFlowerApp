<div class="min-h-screen bg-[#F9FAFB] flex flex-col items-center py-10 px-6">
  <div
    class="w-full max-w-6xl bg-white rounded-2xl shadow-lg border border-gray-100 p-8 space-y-8"
  >
   
    <div
      class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5 pb-5 border-b border-gray-200"
    >
      <h2
        class="text-3xl font-semibold text-gray-800 tracking-tight flex items-center gap-3"
      >
        <i class="pi pi-list text-[#A6252A] text-2xl"></i>
        All Categories
      </h2>
      <button
        (click)="openAddModal()"
        class="bg-[#A6252A] hover:bg-[#8e1f24] text-white font-semibold px-6 py-2.5 rounded-lg flex items-center gap-2 shadow-sm transition-all duration-200"
      >
        <i class="pi pi-plus text-sm"></i>
        Add New Category
      </button>
    </div>

   
    <div class="flex justify-between items-center flex-wrap gap-4">
      <div class="w-full sm:w-1/3">
        <div class="relative">
          <i
            class="pi pi-search text-gray-500 absolute left-3 top-1/2 -translate-y-1/2"
          ></i>
          <input
            type="text"
            placeholder="Search categories..."
            [(ngModel)]="searchTerm"
            class="w-full pl-10 pr-3 py-3 rounded-lg border border-gray-300 focus:border-[#A6252A] focus:ring-1 focus:ring-[#A6252A] transition"
          />
        </div>
      </div>
    </div>

    
    <div class="overflow-x-auto rounded-xl border border-gray-200 shadow-sm mt-6">
      <table class="min-w-full border-collapse">
        <thead class="bg-gray-100 text-gray-700 text-sm font-semibold">
          <tr>
            <th class="py-4 px-6 text-left">Name</th>
            <th class="py-4 px-6 text-left">Products</th>
            <th class="py-4 px-6 text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let cat of filteredData | slice:(currentPage-1)*rows:(currentPage)*rows"
            class="border-b border-gray-200 hover:bg-gray-50 transition-all duration-150"
          >
            <td class="py-4 px-6 text-gray-800 font-medium">{{ cat.name }}</td>
            <td class="py-4 px-6 text-gray-600">
              {{ cat.productsCount }} products
            </td>
            <td class="py-4 px-6 text-center">
              <div class="flex justify-center gap-3 flex-wrap">
                <button
                  (click)="editCategory(cat)"
                  class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-4 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition"
                >
                  <i class="pi pi-pencil text-sm"></i> Edit
                </button>
                <button
                  (click)="deleteCategory(cat._id)"
                  class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition"
                >
                  <i class="pi pi-trash text-sm"></i> Delete
                </button>
              </div>
            </td>
          </tr>

          <tr *ngIf="filteredData.length === 0">
            <td colspan="3" class="text-center py-6 text-gray-500">
              No categories found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex justify-between items-center mt-6 text-sm text-gray-600">
      <p>
        Showing
        <span class="font-semibold">{{ (currentPage - 1) * rows + 1 }}</span> -
        <span class="font-semibold">{{ getLastIndex() }}</span> of
        <span class="font-semibold">{{ filteredData.length }}</span>
      </p>

      <div class="flex gap-2">
        <button
          (click)="prevPage()"
          [disabled]="currentPage === 1"
          class="px-3 py-1 rounded-md border border-gray-300 hover:bg-gray-100 disabled:opacity-40"
        >
          Prev
        </button>
        <button
          (click)="nextPage()"
          [disabled]="currentPage * rows >= filteredData.length"
          class="px-3 py-1 rounded-md border border-gray-300 hover:bg-gray-100 disabled:opacity-40"
        >
          Next
        </button>
      </div>
    </div>
  </div>

 
  <div
    *ngIf="showModal"
    class="fixed inset-0 bg-black/40 flex items-center justify-center z-50"
  >
    <div
      class="bg-white rounded-2xl p-8 w-full max-w-md shadow-xl relative animate-fade-in"
    >
      <h3 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
        Add New Category
      </h3>

      <div class="space-y-4">
        <div>
          <label class="block text-gray-600 font-medium mb-1">Name</label>
          <input
            type="text"
            [(ngModel)]="newCategory.name"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-1 focus:ring-[#A6252A] focus:border-[#A6252A]"
          />
        </div>

        <div>
          <label class="block text-gray-600 font-medium mb-1">Image</label>
          <input
            type="file"
            (change)="handleImageUpload($event)"
            class="w-full border border-gray-300 rounded-lg px-3 py-2"
          />
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-6">
        <button
          (click)="closeModal()"
          class="px-5 py-2 border rounded-lg hover:bg-gray-100"
        >
          Cancel
        </button>
        <button
          (click)="addCategory()"
          class="px-5 py-2 bg-[#A6252A] text-white rounded-lg hover:bg-[#8e1f24]"
        >
          Save
        </button>
      </div>
    </div>
  </div>
</div>
